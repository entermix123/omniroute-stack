# docker-compose.hybrid.yml - Self-hosted + Cloud providers (production)
# Usage: docker compose -f docker-compose.yml -f docker-compose.hybrid.yml --env-file .env.hybrid up -d

# Includes local model servers (uncomment what you need) + cloud API keys

services:
  omnroute:
    environment:
      # Cloud API keys
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}

